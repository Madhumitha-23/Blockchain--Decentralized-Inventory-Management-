<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inventory Management DApp</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <script defer="" src="app.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    input, button { margin: 5px; padding: 8px; }
    .section { border: 1px solid #ccc; padding: 15px; margin: 15px 0; border-radius: 8px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Inventory Management DApp</h1>

  <div class="section">
    <h2>Add Warehouse Manager</h2>
    <input id="managerAddress" placeholder="Manager Address">
    <button onclick="addManager()">Add Manager</button>
  </div>

  <div class="section">
    <h2>Register Warehouse</h2>
    <input id="warehouseName" placeholder="Name">
    <input id="warehouseLocation" placeholder="Location">
    <button onclick="registerWarehouse()">Register</button>
  </div>

  <div class="section">
    <h2>Add Item to Warehouse</h2>
    <input id="itemName" placeholder="Item Name">
    <input id="itemQty" placeholder="Quantity">
    <input id="itemPrice" placeholder="Price">
    <button onclick="addItem()">Add Item</button>
  </div>

  <div class="section">
    <h2>Create Shipment</h2>
    <input id="shipWarehouse" placeholder="Warehouse Address">
    <input id="shipItemId" placeholder="Item ID">
    <input id="shipQty" placeholder="Quantity">
    <button onclick="createShipment()">Create Shipment</button>
  </div>

  <div class="section">
    <h2>Mark Shipment as Delivered</h2>
    <input id="shipmentId" placeholder="Shipment ID">
    <button onclick="deliverShipment()">Deliver</button>
  </div>

  <div class="section">
    <h2>Status</h2>
    <p id="statusMessage"></p>
  </div>
</body>
</html>
